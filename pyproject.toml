[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sofa"
version = "0.1.0"
description = "vector Spherical-harmonic beam Optimization for Forward modeled Antennas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "healpy>=1.16",
    "astropy>=5.3",
    "pygdsm>=1.4",
    "joblib>=1.3",
    "emcee>=3.1",
    "dynesty>=2.1",
    "corner>=2.2",
    "matplotlib>=3.7",
    "plotly>=5.15",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov", "ipykernel"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sofa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
